<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="100" viewBox="0 0 1000 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grid-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6633aa" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#9370DB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4088ff" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="url(#grid-gradient)" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6633aa" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#9370DB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4088ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background grid pattern -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Horizontal lines with gradient -->
  <line x1="0" y1="25" x2="1000" y2="25" stroke="url(#line-gradient)" stroke-width="0.7" filter="url(#glow)"/>
  <line x1="0" y1="75" x2="1000" y2="75" stroke="url(#line-gradient)" stroke-width="0.7" filter="url(#glow)"/>
  
  <!-- Vertical lines with varying opacity -->
  <g stroke-width="0.5" filter="url(#glow)">
    <line x1="100" y1="0" x2="100" y2="100" stroke="#9370DB" opacity="0.2"/>
    <line x1="200" y1="0" x2="200" y2="100" stroke="#9370DB" opacity="0.3"/>
    <line x1="300" y1="0" x2="300" y2="100" stroke="#9370DB" opacity="0.2"/>
    <line x1="400" y1="0" x2="400" y2="100" stroke="#9370DB" opacity="0.3"/>
    <line x1="500" y1="0" x2="500" y2="100" stroke="#9370DB" opacity="0.4"/>
    <line x1="600" y1="0" x2="600" y2="100" stroke="#9370DB" opacity="0.3"/>
    <line x1="700" y1="0" x2="700" y2="100" stroke="#9370DB" opacity="0.2"/>
    <line x1="800" y1="0" x2="800" y2="100" stroke="#9370DB" opacity="0.3"/>
    <line x1="900" y1="0" x2="900" y2="100" stroke="#9370DB" opacity="0.2"/>
  </g>
  
  <!-- Decorative circles at intersections -->
  <g fill="#9370DB" filter="url(#glow)">
    <circle cx="100" cy="25" r="2" opacity="0.5"/>
    <circle cx="300" cy="25" r="2" opacity="0.5"/>
    <circle cx="500" cy="25" r="3" opacity="0.7"/>
    <circle cx="700" cy="25" r="2" opacity="0.5"/>
    <circle cx="900" cy="25" r="2" opacity="0.5"/>
    
    <circle cx="200" cy="75" r="2" opacity="0.5"/>
    <circle cx="400" cy="75" r="2" opacity="0.5"/>
    <circle cx="600" cy="75" r="2" opacity="0.5"/>
    <circle cx="800" cy="75" r="2" opacity="0.5"/>
  </g>
  
  <!-- Additional decorative elements -->
  <path d="M0,50 Q250,30 500,50 T1000,50" stroke="url(#line-gradient)" stroke-width="0.8" fill="none" opacity="0.5" filter="url(#glow)"/>
  
  <!-- Small dots scattered throughout -->
  <g fill="#9370DB" opacity="0.5">
    <circle cx="50" cy="10" r="0.7"/>
    <circle cx="150" cy="40" r="0.7"/>
    <circle cx="250" cy="90" r="0.7"/>
    <circle cx="350" cy="30" r="0.7"/>
    <circle cx="450" cy="70" r="0.7"/>
    <circle cx="550" cy="20" r="0.7"/>
    <circle cx="650" cy="60" r="0.7"/>
    <circle cx="750" cy="35" r="0.7"/>
    <circle cx="850" cy="85" r="0.7"/>
    <circle cx="950" cy="15" r="0.7"/>
  </g>
</svg>