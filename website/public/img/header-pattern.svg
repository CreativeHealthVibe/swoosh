  <!-- Data flow animations (simulated with gradient) -->
  <linearGradient id="dataFlow1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="rgba(137, 54, 255, 0)"/>
    <stop offset="50%" stop-color="rgba(137, 54, 255, 0.3)"/>
    <stop offset="100%" stop-color="rgba(137, 54, 255, 0)"/>
    <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="0%" to="200%" dur="3s" repeatCount="indefinite"/>
  </linearGradient>
  
